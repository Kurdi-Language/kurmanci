[package]
name = "kurmanci-bench"
version = "0.1.1"
edition = "2021"
authors = ["Kurmancî Language Platform Contributors"]
description = "Engineering benchmark for Kurmancî language packs: memory attribution, load and query latency."
license = "Apache-2.0"
repository = "https://github.com/Kurdi-Language/kurmanci"
homepage = "https://github.com/Kurdi-Language/kurmanci"
publish = false

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
kurmanci_engine = { package = "kurmanci-engine", path = "../engine" }

[[bin]]
name = "kurmanci-bench"
path = "src/main.rs"
