# Kurmancî Language Platform — CI & Determinism Pipeline
name: Continuous Integration

on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-verify:
    name: Build, Lint, Test & Validate Determinism
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          components: rustfmt, clippy

      - name: Validate benchmark transition
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          BASE_DIR="$RUNNER_TEMP/evaluation-base"

          mkdir -p "$BASE_DIR"

          git show "$BASE_SHA:evaluation/spelling/draft-cases.jsonl" \
            > "$BASE_DIR/draft-cases.jsonl"

          git show "$BASE_SHA:evaluation/spelling/reviewed-cases.jsonl" \
            > "$BASE_DIR/reviewed-cases.jsonl"

          cargo run -p kurmanci-data-builder -- validate-eval-transition \
            --base-draft "$BASE_DIR/draft-cases.jsonl" \
            --base-reviewed "$BASE_DIR/reviewed-cases.jsonl" \
            --candidate-draft evaluation/spelling/draft-cases.jsonl \
            --candidate-reviewed evaluation/spelling/reviewed-cases.jsonl

      - name: Cargo Formatting Check
        run: cargo fmt --all --check

      - name: Cargo Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify Source Registry Integrity
        run: cargo run -p kurmanci-data-builder -- verify-sources

      - name: Run Deterministic Hunspell Importer
        run: cargo run -p kurmanci-data-builder -- import-hunspell kurdish-hunspell-kmr

      - name: Run Quality Audit (First Pass)
        run: cargo run -p kurmanci-data-builder -- audit-lexicon kurdish-hunspell-kmr

      - name: Record Quality Audit Pass 1 Checksums
        run: |
          mkdir -p /tmp/ci-check/audit1
          sha256sum data/reports/kurdish-hunspell-kmr/quality-audit/* > /tmp/ci-check/audit1_hashes.txt

      - name: Run Quality Audit (Second Pass - Determinism Verification)
        run: cargo run -p kurmanci-data-builder -- audit-lexicon kurdish-hunspell-kmr

      - name: Verify Quality Audit Report Hash Consistency
        run: |
          mkdir -p /tmp/ci-check/audit2
          sha256sum data/reports/kurdish-hunspell-kmr/quality-audit/* > /tmp/ci-check/audit2_hashes.txt
          diff /tmp/ci-check/audit1_hashes.txt /tmp/ci-check/audit2_hashes.txt
          echo "Quality audit report determinism verification passed."

      - name: Run Review Infrastructure Pipeline (First Pass)
        run: |
          cargo run -p kurmanci-data-builder -- generate-review-queues kurdish-hunspell-kmr
          cargo run -p kurmanci-data-builder -- validate-review-decisions kurdish-hunspell-kmr

      - name: Record Review Infrastructure Pass 1 Checksums
        run: |
          mkdir -p /tmp/ci-check/review1
          find data/review-queues/kurdish-hunspell-kmr data/reports/controlled-lexicon-review -type f -exec sha256sum {} + | sort > /tmp/ci-check/review1/checksums.txt

      - name: Run Review Infrastructure Pipeline (Second Pass - Determinism Verification)
        run: |
          cargo run -p kurmanci-data-builder -- generate-review-queues kurdish-hunspell-kmr
          cargo run -p kurmanci-data-builder -- validate-review-decisions kurdish-hunspell-kmr

      - name: Verify Review Infrastructure Determinism
        run: |
          mkdir -p /tmp/ci-check/review2
          find data/review-queues/kurdish-hunspell-kmr data/reports/controlled-lexicon-review -type f -exec sha256sum {} + | sort > /tmp/ci-check/review2/checksums.txt
          diff /tmp/ci-check/review1/checksums.txt /tmp/ci-check/review2/checksums.txt
          echo "Review infrastructure 2-pass determinism verification passed."

      - name: Build Controlled Packs (First Pass)
        run: |
          cargo run -p kurmanci-data-builder -- build-pack seed
          cargo run -p kurmanci-data-builder -- build-pack reviewed
          cargo run -p kurmanci-data-builder -- build-pack experimental-full

      - name: Record Controlled Packs Pass 1 Checksums
        run: |
          mkdir -p /tmp/ci-check/packs1
          cp -r data/build/packs /tmp/ci-check/pass1_packs
          find data/build/packs -type f -exec sha256sum {} + | sort > /tmp/ci-check/packs1/checksums.txt

      - name: Build Controlled Packs (Second Pass - Determinism Verification)
        run: |
          cargo run -p kurmanci-data-builder -- build-pack seed
          cargo run -p kurmanci-data-builder -- build-pack reviewed
          cargo run -p kurmanci-data-builder -- build-pack experimental-full

      - name: Verify Controlled Packs Determinism & Manifest Invariants
        run: |
          mkdir -p /tmp/ci-check/packs2
          cp -r data/build/packs /tmp/ci-check/pass2_packs
          find data/build/packs -type f -exec sha256sum {} + | sort > /tmp/ci-check/packs2/checksums.txt
          diff /tmp/ci-check/packs1/checksums.txt /tmp/ci-check/packs2/checksums.txt
          cargo run -p kurmanci-data-builder -- validate-pack-manifest
          cargo run -p kurmanci-data-builder -- validate-eval-cases
          test -f data/reports/evaluation-provenance/artifacts.sha256
          echo "Controlled packs & evaluation case validator verification passed."

      - name: Run Three-Pack Comparison Engine (First Pass)
        run: cargo run -p kurmanci-data-builder -- evaluate-packs

      - name: Record Three-Pack Comparison Pass 1 Checksums
        run: |
          mkdir -p /tmp/ci-check/comp1
          find data/reports/pack-comparison -type f -exec sha256sum {} + | sort > /tmp/ci-check/comp1/checksums.txt

      - name: Run Three-Pack Comparison Engine (Second Pass - Determinism Verification)
        run: cargo run -p kurmanci-data-builder -- evaluate-packs

      - name: Verify Three-Pack Comparison Determinism
        run: |
          mkdir -p /tmp/ci-check/comp2
          find data/reports/pack-comparison -type f -exec sha256sum {} + | sort > /tmp/ci-check/comp2/checksums.txt
          diff /tmp/ci-check/comp1/checksums.txt /tmp/ci-check/comp2/checksums.txt
          echo "Three-pack comparison report 2-pass determinism verification passed."

      - name: Verify 4C Review Infrastructure & 4C.3 Reviewed Pack
        run: |
          python3 scripts/verify_4c2a_regression_worksheet.py
          python3 scripts/verify_4c2b_review_guide.py
          python3 scripts/verify_4c3_reviewed_pack.py --candidate-root . --compare-root-a /tmp/ci-check/pass1_packs --compare-root-b /tmp/ci-check/pass2_packs
          python3 scripts/verify_4c3_reviewed_pack.py --self-test


      - name: Run 3C1 Pipeline (First Pass)

        run: |
          cargo run -p kurmanci-data-builder -- import-all-corpora
          cargo run -p kurmanci-data-builder -- inventory-corpora
          cargo run -p kurmanci-data-builder -- audit-corpora
          cargo run -p kurmanci-data-builder -- partition-corpora

      - name: Record 3C1 First Pass Checksums
        run: |
          mkdir -p /tmp/ci-check/c31_pass1
          find data/imported-canonical data/build/corpus-partitions data/reports/corpus-inventory data/reports/corpus-quality data/reports/corpus-partitions -type f -exec sha256sum {} + | sort > /tmp/ci-check/c31_pass1/checksums.txt

      - name: Run 3C1 Pipeline (Second Pass - Determinism Verification)
        run: |
          cargo run -p kurmanci-data-builder -- import-all-corpora
          cargo run -p kurmanci-data-builder -- inventory-corpora
          cargo run -p kurmanci-data-builder -- audit-corpora
          cargo run -p kurmanci-data-builder -- partition-corpora

      - name: Verify 3C1 Determinism
        run: |
          mkdir -p /tmp/ci-check/c31_pass2
          find data/imported-canonical data/build/corpus-partitions data/reports/corpus-inventory data/reports/corpus-quality data/reports/corpus-partitions -type f -exec sha256sum {} + | sort > /tmp/ci-check/c31_pass2/checksums.txt
          diff /tmp/ci-check/c31_pass1/checksums.txt /tmp/ci-check/c31_pass2/checksums.txt
          echo "Milestone 3C1 build determinism verification passed."

      - name: Run Frequency Builder (First Pass)
        run: cargo run -p kurmanci-data-builder -- build-frequencies

      - name: Record Frequency Build Pass 1 Checksums
        run: |
          mkdir -p /tmp/ci-check/freq1
          sha256sum data/build/frequencies.jsonl > /tmp/ci-check/freq1/frequencies.sha256
          sha256sum data/reports/frequencies/* > /tmp/ci-check/freq1/reports.sha256

      - name: Run Frequency Builder (Second Pass - Determinism Verification)
        run: cargo run -p kurmanci-data-builder -- build-frequencies

      - name: Verify Frequency Build Determinism
        run: |
          mkdir -p /tmp/ci-check/freq2
          sha256sum data/build/frequencies.jsonl > /tmp/ci-check/freq2/frequencies.sha256
          sha256sum data/reports/frequencies/* > /tmp/ci-check/freq2/reports.sha256
          diff /tmp/ci-check/freq1/frequencies.sha256 /tmp/ci-check/freq2/frequencies.sha256
          diff /tmp/ci-check/freq1/reports.sha256 /tmp/ci-check/freq2/reports.sha256
          echo "Frequency build determinism verification passed."

      - name: Run N-Gram Builder (First Pass)
        run: cargo run -p kurmanci-data-builder -- build-ngrams

      - name: Record N-Gram Build Pass 1 Checksums
        run: |
          mkdir -p /tmp/ci-check/ngram1
          sha256sum data/build/bigrams.jsonl > /tmp/ci-check/ngram1/bigrams.sha256
          sha256sum data/build/trigrams.jsonl > /tmp/ci-check/ngram1/trigrams.sha256
          sha256sum data/reports/ngrams/* > /tmp/ci-check/ngram1/bigram_reports.sha256
          sha256sum data/reports/trigrams/* > /tmp/ci-check/ngram1/trigram_reports.sha256

      - name: Run N-Gram Builder (Second Pass - Determinism Verification)
        run: cargo run -p kurmanci-data-builder -- build-ngrams

      - name: Verify N-Gram Build Determinism
        run: |
          mkdir -p /tmp/ci-check/ngram2
          sha256sum data/build/bigrams.jsonl > /tmp/ci-check/ngram2/bigrams.sha256
          sha256sum data/build/trigrams.jsonl > /tmp/ci-check/ngram2/trigrams.sha256
          sha256sum data/reports/ngrams/* > /tmp/ci-check/ngram2/bigram_reports.sha256
          sha256sum data/reports/trigrams/* > /tmp/ci-check/ngram2/trigram_reports.sha256
          diff /tmp/ci-check/ngram1/bigrams.sha256 /tmp/ci-check/ngram2/bigrams.sha256
          diff /tmp/ci-check/ngram1/trigrams.sha256 /tmp/ci-check/ngram2/trigrams.sha256
          diff /tmp/ci-check/ngram1/bigram_reports.sha256 /tmp/ci-check/ngram2/bigram_reports.sha256
          diff /tmp/ci-check/ngram1/trigram_reports.sha256 /tmp/ci-check/ngram2/trigram_reports.sha256
          echo "N-gram build determinism verification passed."

      - name: Run Cargo Workspace Tests
        run: cargo test --workspace

      - name: Run Data-Builder Compiler (First Pass)
        run: cargo run -p kurmanci-data-builder -- build

      - name: Record First Pass Checksums
        run: |
          mkdir -p /tmp/ci-check
          sha256sum data/build/lexicon.bin > /tmp/ci-check/pass1_bin.sha256
          sha256sum data/build/manifest.json > /tmp/ci-check/pass1_manifest.sha256
          echo "Pass 1 lexicon.bin: $(cat /tmp/ci-check/pass1_bin.sha256)"
          echo "Pass 1 manifest.json: $(cat /tmp/ci-check/pass1_manifest.sha256)"

      - name: Run Data-Builder Compiler (Second Pass - Determinism Verification)
        run: cargo run -p kurmanci-data-builder -- build

      - name: Verify Deterministic Binary Hash Consistency
        run: |
          sha256sum data/build/lexicon.bin > /tmp/ci-check/pass2_bin.sha256
          sha256sum data/build/manifest.json > /tmp/ci-check/pass2_manifest.sha256
          echo "Pass 2 lexicon.bin: $(cat /tmp/ci-check/pass2_bin.sha256)"
          echo "Pass 2 manifest.json: $(cat /tmp/ci-check/pass2_manifest.sha256)"
          diff /tmp/ci-check/pass1_bin.sha256 /tmp/ci-check/pass2_bin.sha256
          diff /tmp/ci-check/pass1_manifest.sha256 /tmp/ci-check/pass2_manifest.sha256
          echo "Deterministic build verification passed."

      - name: Run Ranking Evaluation (First Pass)
        run: cargo run -p kurmanci-data-builder -- evaluate-ranking

      - name: Record Ranking Evaluation Pass 1 Checksums
        run: |
          mkdir -p /tmp/ci-check/eval1
          sha256sum data/reports/ranking-evaluation/* > /tmp/ci-check/eval1/reports.sha256

      - name: Run Ranking Evaluation (Second Pass - Determinism Verification)
        run: cargo run -p kurmanci-data-builder -- evaluate-ranking

      - name: Verify Ranking Evaluation Determinism
        run: |
          mkdir -p /tmp/ci-check/eval2
          sha256sum data/reports/ranking-evaluation/* > /tmp/ci-check/eval2/reports.sha256
          diff /tmp/ci-check/eval1/reports.sha256 /tmp/ci-check/eval2/reports.sha256
          echo "Ranking evaluation report determinism verification passed."

      - name: Run Context Prediction Evaluation (First Pass)
        run: cargo run -p kurmanci-data-builder -- evaluate-next-word

      - name: Record Context Prediction Evaluation Pass 1 Checksums
        run: |
          mkdir -p /tmp/ci-check/nextword1
          sha256sum data/reports/context-prediction-evaluation/* > /tmp/ci-check/nextword1/reports.sha256

      - name: Run Context Prediction Evaluation (Second Pass - Determinism Verification)
        run: cargo run -p kurmanci-data-builder -- evaluate-next-word

      - name: Verify Context Prediction Evaluation Determinism
        run: |
          mkdir -p /tmp/ci-check/nextword2
          sha256sum data/reports/context-prediction-evaluation/* > /tmp/ci-check/nextword2/reports.sha256
          diff /tmp/ci-check/nextword1/reports.sha256 /tmp/ci-check/nextword2/reports.sha256
          echo "Context prediction evaluation report determinism verification passed."

      - name: Test Generated Binary Pack Integration & Embed Example
        run: |
          cargo test -p kurmanci-engine --test binary_pack_test
          cargo test -p kurmanci-engine --test binary_integrity_tests
          cargo run -p kurmanci-engine --example embed_example -- data/build/packs/seed/lexicon.bin

      - name: Verify Public Engine API Docs & Benchmark Compilation
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --package kurmanci-engine
          cargo bench --no-run --package kurmanci-engine

      - name: Build C ABI Library & Run C/C++ Header Syntax Checks
        run: |
          cargo build -p kurmanci-ffi
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -I ffi/include -c ffi/tests/include_c.c -o /dev/null
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -I ffi/include -c ffi/tests/include_cpp.cpp -o /dev/null

      - name: Compile and Run C ABI Smoke Test
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -I ffi/include ffi/tests/c_smoke_test.c -L target/debug -lkurmanci_ffi -o target/debug/c_smoke_test
          LD_LIBRARY_PATH=target/debug DYLD_LIBRARY_PATH=target/debug ./target/debug/c_smoke_test data/build/packs/seed/lexicon.bin

      - name: Verify Swift Header Synchronization & Test Suite
        run: |
          cmp ffi/include/kurmanci.h swift/Sources/CKurmanci/include/kurmanci.h
          LD_LIBRARY_PATH="$PWD/target/debug" DYLD_LIBRARY_PATH="$PWD/target/debug" swift test --package-path swift -Xlinker -L -Xlinker "$PWD/target/debug"

      - name: Run Swift Command-Line Example
        run: |
          LD_LIBRARY_PATH="$PWD/target/debug" DYLD_LIBRARY_PATH="$PWD/target/debug" swift run --package-path swift -Xlinker -L -Xlinker "$PWD/target/debug" KurmanciExample data/build/packs/seed/lexicon.bin

      - name: Verify Repository Cleanliness
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Test CLI Query Functionality
        run: |
          cargo run -p kurmanci-cli -- suggest rojb
          cargo run -p kurmanci-cli -- predict-next ez --explain
          cargo run -p kurmanci-cli -- predict-next ez ji --explain

  swift-macos:
    name: Swift Package on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'

      - name: Build seed pack and native library
        run: |
          cargo run -p kurmanci-data-builder -- build-pack seed
          cargo build -p kurmanci-ffi

      - name: Verify synchronized header
        run: |
          cmp ffi/include/kurmanci.h swift/Sources/CKurmanci/include/kurmanci.h

      - name: Test Swift package
        run: |
          DYLD_LIBRARY_PATH="$PWD/target/debug" swift test --package-path swift -Xlinker -L -Xlinker "$PWD/target/debug"

      - name: Run Swift example
        run: |
          DYLD_LIBRARY_PATH="$PWD/target/debug" swift run --package-path swift -Xlinker -L -Xlinker "$PWD/target/debug" KurmanciExample data/build/packs/seed/lexicon.bin

      - name: Build Swift package in release mode
        run: |
          DYLD_LIBRARY_PATH="$PWD/target/debug" swift build --package-path swift -c release -Xlinker -L -Xlinker "$PWD/target/debug"


