name: Release Kurmancî Android SDK to Maven Central (5E)

on:
  push:
    tags:
      - 'android-v*'

concurrency:
  group: android-maven-central-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-android-sdk:
    name: Build, Validate, Sign & Publish Android SDK to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate Tag Version Format
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#android-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Error: Release tag '$TAG' does not match semver 'android-vX.Y.Z'" >&2
            exit 1
          fi
          DEFAULT_GROUP="$(grep '^kurmanciMavenGroup=' android/gradle.properties 2>/dev/null | cut -d'=' -f2 | tr -d ' \r\n' || echo 'io.github.ferhatguneri')"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "GROUP_ID=${DEFAULT_GROUP}" >> "$GITHUB_ENV"
          echo "✅ Validated release tag ${TAG} -> Android SDK v${VERSION} for group ${DEFAULT_GROUP}"

      - name: Validate Release Tag Provenance & Gradle Version
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "❌ Error: Tagged release commit $GITHUB_SHA is not an ancestor of origin/main!" >&2
            exit 1
          fi
          echo "✅ Release tag commit is confirmed to be on origin/main."

          GRADLE_VERSION="$(grep '^kurmanciVersion=' android/gradle.properties 2>/dev/null | cut -d'=' -f2 | tr -d ' \r\n')"
          if [[ "$VERSION" != "$GRADLE_VERSION" ]]; then
            echo "❌ Error: Release tag version '$VERSION' does not match kurmanciVersion '$GRADLE_VERSION' in android/gradle.properties" >&2
            exit 1
          fi
          echo "✅ Release tag version '$VERSION' matches android/gradle.properties version."

      - name: Verify Required Publication Secrets
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          MISSING=0
          for sec in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_SIGNING_KEY MAVEN_SIGNING_PASSWORD; do
            if [[ -z "${!sec:-}" ]]; then
              echo "❌ Error: Required release secret $sec is missing or empty" >&2
              MISSING=1
            fi
          done
          if [[ $MISSING -eq 1 ]]; then
            exit 1
          fi
          echo "✅ All 4 Maven Central publication secrets verified."

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK 26.1.10909125 (r26b)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          targets: 'aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android'

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --version 3.5.0

      - name: Build seed pack
        run: |
          cargo run -p kurmanci-data-builder -- build-pack seed

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Step 1: Pre-publication Build & Local Consumer Gate (Unsigned)
      - name: Build AAR & Run Local Consumer Emulator Tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            VERSION="${VERSION}" GROUP_ID="${GROUP_ID}" ./scripts/android/build-aar.sh
            VERSION="${VERSION}" GROUP_ID="${GROUP_ID}" CONSUMER_MODE="local" ./scripts/android/test-consumers.sh

      # Step 2: Prepare & Sign Central Staging Bundle
      - name: Prepare & Sign Central Bundle
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          VERSION="${VERSION}" GROUP_ID="${GROUP_ID}" ./scripts/android/prepare-central-bundle.sh

      # Step 3: Verify Signed Central Bundle
      - name: Verify Complete Signed Central Bundle
        run: |
          VERSION="${VERSION}" GROUP_ID="${GROUP_ID}" CHECK_SIGNATURES=true ./scripts/android/verify-central-bundle.sh

      # Step 4: Verify Transport ZIP Bundle
      - name: Verify Transport Central ZIP Bundle
        shell: bash
        run: |
          ZIP_PATH="dist/central-bundle-${VERSION}.zip"
          if [[ ! -f "$ZIP_PATH" ]]; then
            echo "❌ Error: Central ZIP bundle missing at $ZIP_PATH" >&2
            exit 1
          fi
          echo "Verifying integrity of transport ZIP bundle $ZIP_PATH..."
          unzip -t "$ZIP_PATH"
          echo "Logging transport ZIP manifest:"
          unzip -l "$ZIP_PATH"
          echo "✅ Transport ZIP integrity verified."

      # Step 5: Upload to Official Maven Central Publisher API (USER_MANAGED)
      - name: Upload Bundle to Maven Central Publisher API
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          ZIP_PATH="dist/central-bundle-${VERSION}.zip"
          if [[ ! -f "$ZIP_PATH" ]]; then
            echo "❌ Error: Central ZIP bundle missing at $ZIP_PATH" >&2
            exit 1
          fi

          echo "Uploading $ZIP_PATH to Maven Central Publisher API (USER_MANAGED)..."
          
          AUTH_TOKEN=$(echo -n "${MAVEN_CENTRAL_USERNAME}:${MAVEN_CENTRAL_PASSWORD}" | base64 | tr -d '\n')
          
          RESPONSE=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${AUTH_TOKEN}" \
            --form "bundle=@${ZIP_PATH};type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED")

          DEPLOYMENT_ID="$(printf '%s' "$RESPONSE" | tr -d '\r\n')"

          if [[ ! "$DEPLOYMENT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "❌ Error: Invalid Central deployment ID format: $DEPLOYMENT_ID" >&2
            echo "$RESPONSE" >&2
            exit 1
          fi

          echo "DEPLOYMENT_ID=${DEPLOYMENT_ID}" >> "$GITHUB_ENV"
          echo "✅ Upload succeeded. Deployment ID: ${DEPLOYMENT_ID}"

      # Step 6: Poll Central Status Until VALIDATED (POST /api/v1/publisher/status?id=<id>)
      - name: Poll Deployment Status Until VALIDATED
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          AUTH_TOKEN=$(echo -n "${MAVEN_CENTRAL_USERNAME}:${MAVEN_CENTRAL_PASSWORD}" | base64 | tr -d '\n')
          echo "Polling Central status for deployment ID ${DEPLOYMENT_ID} until VALIDATED..."

          for attempt in {1..30}; do
            STATUS_JSON=$(curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer ${AUTH_TOKEN}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")

            STATE="$(printf '%s' "$STATUS_JSON" | python3 -c 'import json,sys; o=json.load(sys.stdin); print(o.get("deploymentState") or o.get("state") or "UNKNOWN")')"

            echo "  Attempt $attempt: State = $STATE"
            if [[ "$STATE" == "VALIDATED" ]]; then
              echo "✅ Central Deployment VALIDATED!"
              exit 0
            elif [[ "$STATE" == "FAILED" ]]; then
              echo "❌ Fatal Error: Central Deployment FAILED validation:" >&2
              echo "$STATUS_JSON" | python3 -m json.tool >&2 || echo "$STATUS_JSON" >&2
              exit 1
            elif [[ "$STATE" == "UNKNOWN" ]]; then
              echo "❌ Error: Unknown deployment state in response:" >&2
              echo "$STATUS_JSON" >&2
              exit 1
            fi
            sleep 15
          done

          echo "❌ Error: Timed out waiting for Central deployment to reach VALIDATED state" >&2
          exit 1

      # Step 7: Test Staged Deployment Repository on Emulator
      - name: Test Staged Deployment Repository on Emulator
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Note: android-emulator-runner executes each physical script line in a separate sh -c, so stateful setup must not be split across lines.
          script: |
            VERSION="${VERSION}" GROUP_ID="${GROUP_ID}" CONSUMER_MODE="staged" STAGED_REPO_URL="https://central.sonatype.com/api/v1/publisher/deployment/${DEPLOYMENT_ID}/download/" STAGED_AUTH_TOKEN="Bearer $(printf '%s:%s' "${MAVEN_CENTRAL_USERNAME}" "${MAVEN_CENTRAL_PASSWORD}" | base64 | tr -d '\n')" ./scripts/android/test-consumers.sh

      # Step 8: Promote Central Deployment to RELEASED
      - name: Promote Central Deployment to RELEASED
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          AUTH_TOKEN=$(echo -n "${MAVEN_CENTRAL_USERNAME}:${MAVEN_CENTRAL_PASSWORD}" | base64 | tr -d '\n')
          echo "Promoting deployment ${DEPLOYMENT_ID} to RELEASED..."

          PROMOTE_RES=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${AUTH_TOKEN}" \
            "https://central.sonatype.com/api/v1/publisher/deployment/${DEPLOYMENT_ID}")

          echo "Promotion response: $PROMOTE_RES"

          echo "Polling Central status until PUBLISHED..."
          PUBLISHED_SUCCESS=0
          for attempt in {1..30}; do
            STATUS_JSON=$(curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer ${AUTH_TOKEN}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")

            STATE="$(printf '%s' "$STATUS_JSON" | python3 -c 'import json,sys; o=json.load(sys.stdin); print(o.get("deploymentState") or o.get("state") or "UNKNOWN")')"

            echo "  Attempt $attempt: State = $STATE"
            if [[ "$STATE" == "PUBLISHED" ]]; then
              echo "✅ Central Deployment PUBLISHED!"
              PUBLISHED_SUCCESS=1
              break
            elif [[ "$STATE" == "FAILED" ]]; then
              echo "❌ Error: Central Deployment FAILED promotion/publish state:" >&2
              echo "$STATUS_JSON" | python3 -m json.tool >&2 || echo "$STATUS_JSON" >&2
              exit 1
            elif [[ "$STATE" == "UNKNOWN" ]]; then
              echo "❌ Error: Unknown deployment state in response:" >&2
              echo "$STATUS_JSON" >&2
              exit 1
            fi
            sleep 20
          done

          if [[ $PUBLISHED_SUCCESS -ne 1 ]]; then
            echo "❌ Fatal Error: Timed out waiting for deployment ${DEPLOYMENT_ID} to reach PUBLISHED state" >&2
            exit 1
          fi

      # Step 9: Bounded Retry for Public Maven Central Propagation (Mandatory Failure on Timeout)
      - name: Bounded Retry for Public Maven Central CDN Propagation
        run: |
          GROUP_PATH="$(echo "$GROUP_ID" | tr '.' '/')"
          PUBLIC_POM_URL="https://repo1.maven.org/maven2/${GROUP_PATH}/kurmanci-android/${VERSION}/kurmanci-android-${VERSION}.pom"
          echo "Polling public Maven Central CDN for ${PUBLIC_POM_URL}..."

          PROPAGATION_SUCCESS=0
          for attempt in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_POM_URL" || true)
            echo "  Attempt $attempt: HTTP status = $HTTP_CODE"
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "✅ Public Maven Central artifact is active and publicly resolvable!"
              PROPAGATION_SUCCESS=1
              break
            fi
            sleep 20
          done

          if [[ $PROPAGATION_SUCCESS -ne 1 ]]; then
            echo "❌ Fatal Error: Timed out waiting for public Maven Central POM to become available at $PUBLIC_POM_URL" >&2
            exit 1
          fi

      # Step 10: Final Public Consumer Test (mavenCentral() ONLY)
      - name: Test Public mavenCentral() Only Consumer on Emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            VERSION="${VERSION}" GROUP_ID="${GROUP_ID}" CONSUMER_MODE="public" ./scripts/android/test-consumers.sh

      - name: Report Android Release Success
        run: |
          echo "🎉 Kurmancî Android SDK v${VERSION} successfully published to Maven Central under ${GROUP_ID}:kurmanci-android:${VERSION}!"
