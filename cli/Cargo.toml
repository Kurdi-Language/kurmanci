[package]
name = "kurmanci-cli"
version = "0.1.0"
edition = "2021"
authors = ["Kurmancî Language Platform Contributors"]
description = "Command-line access tool for Kurmancî core language engine."
license = "Apache-2.0"
repository = "https://github.com/Kurdi-Language/kurmanci"
homepage = "https://github.com/Kurdi-Language/kurmanci"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
kurmanci_engine = { package = "kurmanci-engine", path = "../engine" }

[[bin]]
name = "kurmanci"
path = "src/main.rs"
